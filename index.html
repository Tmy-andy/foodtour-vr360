<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản Đồ Du Lịch Ngõ Hẻm TP.HCM</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Leaflet MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    
    <!-- Pannellum CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <!-- Logo Sở Du lịch HCM - bên trái -->
        <div class="header__logo">
            <img src="assets/logo/logo.png" alt="Sở Du lịch TP.HCM" class="header__tourism-logo">
        </div>
        
        <!-- Title - giữa -->
        <h1 class="header__title">HẺM SÀI GÒN</h1>
        
        <!-- Search và Theme toggle - bên phải -->
        <div class="header__controls">
            <div class="header__search">
                <input type="text" id="search-input" class="search-input" placeholder="Tìm kiếm quán ăn, cafe...">
                <button class="search-btn" id="search-btn">
                    <i data-lucide="search"></i>
                </button>
            </div>
            <button class="theme-toggle" id="theme-toggle" aria-label="Chuyển đổi giao diện" title="Chuyển đổi sáng/tối">
                <img src="assets/icons/moon.png" alt="Dark mode" class="theme-toggle__icon theme-toggle__icon--dark">
                <img src="assets/icons/sun.png" alt="Light mode" class="theme-toggle__icon theme-toggle__icon--light">
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Mobile Toggle Button (hidden by default, shown when sidebar is collapsed) -->
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Mở danh sách">
            <i data-lucide="list" class="sidebar-toggle__icon"></i>
            <span class="sidebar-toggle__text">Danh sách</span>
        </button>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <!-- Drag Handle for mobile -->
            <div class="sidebar__drag-handle" id="sidebar-drag-handle">
                <span class="drag-bar"></span>
            </div>
            
            <!-- Filter Tabs -->
            <div class="filter-tabs">
                <button class="filter-tab active" data-category="all">
                    <i data-lucide="layout-grid" class="filter-tab__icon"></i>
                    <span>Tất cả</span>
                </button>
                <button class="filter-tab" data-category="food">
                    <i data-lucide="utensils" class="filter-tab__icon"></i>
                    <span>Ẩm thực</span>
                </button>
                <button class="filter-tab" data-category="cafe">
                    <i data-lucide="coffee" class="filter-tab__icon"></i>
                    <span>Cafe</span>
                </button>
            </div>
            
            <!-- POI List -->
            <div class="poi-list" id="poi-list">
                <!-- POI cards will be rendered here by JavaScript -->
            </div>
        </aside>

        <!-- Map Container -->
        <main class="map-wrapper">
            <div id="map-container" class="map-container"></div>
        </main>
    </div>

    <!-- Panorama Overlay -->
    <div id="panorama-overlay" class="panorama-overlay hidden">
        <div id="panorama-loading" class="loading-spinner">
            <div class="spinner"></div>
            <p>Đang tải panorama...</p>
        </div>
        <button id="panorama-close" class="panorama-close-btn" aria-label="Đóng panorama">✕</button>
        <div id="panorama-container" class="panorama-container"></div>
        
        <!-- Scene Info -->
        <div id="scene-info" class="scene-info">
            <span id="scene-name"></span>
        </div>
    </div>

    <!-- POI Modal -->
    <div id="poi-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <button class="modal-close" id="modal-close" aria-label="Đóng">✕</button>
            <img id="modal-image" class="modal-card__image" src="" alt="">
            <div class="modal-card__body">
                <span id="modal-category" class="modal-card__category"></span>
                <h2 id="modal-name" class="modal-card__name"></h2>
                <p id="modal-alley" class="modal-card__alley"></p>
                <div id="modal-rating" class="modal-card__rating"></div>
                <p id="modal-description" class="modal-card__description"></p>
                <p id="modal-hours" class="modal-card__hours">
                    <span class="hours-icon">🕐</span>
                    <span id="modal-hours-text"></span>
                </p>
                <a id="modal-cta" class="modal-card__cta" href="#" target="_blank" rel="noopener noreferrer">
                    Xem Website 360 →
                </a>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Leaflet MarkerCluster JS -->
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    
    <!-- Pannellum JS -->
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    
    <!-- App Modules -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
